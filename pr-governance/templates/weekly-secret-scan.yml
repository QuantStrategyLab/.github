name: Weekly secret scan

# Copy to .github/workflows/weekly-secret-scan.yml and replace
# __GOVERNANCE_REPO__. Requires the SECRET_SCAN_BASELINE_B64 secret: the
# redacted identities of findings that predate the policy. The scan refuses to
# run without it, so an empty baseline can never be mistaken for a clean history.

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-secret-scan
  cancel-in-progress: false

jobs:
  history:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all remote branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Scan history
        uses: __GOVERNANCE_REPO__/pr-governance@v1
        env:
          SECRET_SCAN_BASELINE_B64: ${{ secrets.SECRET_SCAN_BASELINE_B64 }}
        with:
          mode: scan
          full-history: 'true'
