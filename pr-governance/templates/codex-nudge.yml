name: Review request

# Copy to .github/workflows/codex-nudge.yml and replace __GOVERNANCE_REPO__.
# Nudges Codex then Claude (see policy.review_routing). Cursor Bugbot must be
# triggered by a human (`cursor review` / `bugbot run`); bot-posted triggers are ignored.
# Optional org var GOVERNANCE_REVIEWERS_JSON overrides reviewer identities.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  # createComment on a pull request needs pull-requests:write; issues:write
  # alone returns 403 Resource not accessible by integration.
  pull-requests: write
  issues: write

concurrency:
  group: review-request
  cancel-in-progress: false

jobs:
  nudge:
    name: Request a review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request
        uses: __GOVERNANCE_REPO__/pr-governance@__GOVERNANCE_SHA__
        env:
          GOVERNANCE_REVIEWERS_JSON: ${{ vars.GOVERNANCE_REVIEWERS_JSON }}
          GOVERNANCE_DISPATCH_MENTIONS_JSON: ${{ vars.GOVERNANCE_DISPATCH_MENTIONS_JSON }}
        with:
          mode: nudge
