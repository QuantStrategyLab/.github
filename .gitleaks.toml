title = "Shared publication and history scan rules"

[extend]
useDefault = true

[[rules]]
id = "telegram-bot-token-format"
description = "Telegram bot token format without a keyword prerequisite"
regex = '''\b\d{6,12}:A[A-Za-z0-9_-]{34}\b'''

[[rules]]
id = "json-credential-field"
description = "Non-trivial credential value in a JSON field"
regex = '''(?i)"(?:token|bot_token|api_key)"\s*:\s*"([^"\r\n\\]{8,})"'''
secretGroup = 1

[[rules.allowlists]]
description = "Only explicit synthetic JSON placeholders in the scanner fixture"
condition = "AND"
paths = ['''(^|/)tests/fixtures/secret-scan/placeholder\.json$''']
regexTarget = "secret"
regexes = ['''^FAKE_[A-Z0-9_]{8,}$''']
