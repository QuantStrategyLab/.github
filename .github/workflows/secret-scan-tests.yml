name: Secret scan tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    name: Secret scanner regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install checksum-verified Gitleaks
        run: bash scripts/install-gitleaks.sh "$RUNNER_TEMP/test-gitleaks"
      - name: Test publication and history scans with runtime-only fake values
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/test-gitleaks/gitleaks
        run: python3 scripts/test_secret_scan.py
      - name: Exercise the composite action on the clean checkout
        uses: ./actions/scan-before-publish
        with:
          path: .
  secret-scan:
    name: Secret scan
    uses: ./.github/workflows/gitleaks.yml
