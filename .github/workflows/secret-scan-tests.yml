name: Secret scan tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    name: Secret scanner regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install checksum-verified Gitleaks
        run: bash scripts/install-gitleaks.sh "$RUNNER_TEMP/test-gitleaks"
      - name: Test publication and history scans with runtime-only fake values
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/test-gitleaks/gitleaks
        run: python3 scripts/test_secret_scan.py
      - name: Exercise the composite action on the clean checkout
        uses: ./actions/scan-before-publish
        with:
          path: .
  secret-scan:
    name: Secret scan
    uses: ./.github/workflows/gitleaks.yml
