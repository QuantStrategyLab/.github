name: Documentation check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      # The checker runs before the tests because a rule that stopped working
      # would otherwise report a clean repository. The tests are the only thing
      # that notices the difference between "no findings" and "no checking".
      - name: Test the documentation checker
        run: python scripts/test_style.py
      - name: Check documentation rules
        run: |
          args=(--phase 2)
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            args+=(--base-ref 'HEAD^1')
          fi
          python scripts/check_style.py "${args[@]}"
