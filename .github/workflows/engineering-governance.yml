name: Engineering governance

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
      - name: Scan added commits with redacted findings
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-$PUSH_BASE}"
          head="${PR_HEAD:-$PUSH_HEAD}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "No base commit is available for this event" >&2
            exit 1
          fi
          python3 scripts/scan-secrets.py git . \
            --gitleaks "$RUNNER_TEMP/gitleaks-bin/gitleaks" --log-opts="$base..$head"

  commitlint:
    name: Commit message convention
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pull request commit messages
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/governance-commitlint"
          npm install --prefix "$tool" --ignore-scripts --no-audit --no-fund \
            @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4
          printf '%s\n' "module.exports = {extends: [require.resolve('@commitlint/config-conventional')], defaultIgnores: true, ignores: [(message) => /^Merge /.test(message)], rules: {'subject-case': [0], 'header-max-length': [2, 'always', 72], 'type-enum': [2, 'always', ['feat', 'fix', 'docs', 'refactor', 'test', 'chore', 'perf', 'ci']]}};" > "$tool/commitlint.config.cjs"
          node "$tool/node_modules/@commitlint/cli/cli.js" \
            --config "$tool/commitlint.config.cjs" --from "$PR_BASE" --to "$PR_HEAD" --verbose
