name: Deploy a fixed container image
on:
  workflow_call:
    inputs:
      provider:
        required: true
        type: string
      environment:
        required: true
        type: string
      operation:
        required: true
        type: string
    secrets:
      DEPLOY_WIF_PROVIDER:
        required: false
      DEPLOY_SERVICE_ACCOUNT:
        required: false
      DEPLOY_RESOURCE:
        required: false
      DEPLOY_PREVIOUS_IMAGE:
        required: false
      DEPLOY_CANDIDATE_IMAGE:
        required: false
permissions: {}
jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: ${{ inputs.environment }}
    concurrency:
      group: release-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - name: Sign in to Azure with OIDC
        if: inputs.provider == 'azure'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        env:
          AZURE_CORE_OUTPUT: none
        with:
          client-id: ${{ vars.DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.DEPLOY_TENANT_ID }}
          subscription-id: ${{ vars.DEPLOY_SUBSCRIPTION_ID }}
      - name: Exchange GitHub OIDC for a Google access token
        if: inputs.provider == 'gcp' || inputs.provider == 'gcp-service'
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.DEPLOY_WIF_PROVIDER || vars.DEPLOY_WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT || vars.DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Release and verify the fixed image
        env:
          PROVIDER: ${{ inputs.provider }}
          OPERATION: ${{ inputs.operation }}
          RESOURCE: ${{ secrets.DEPLOY_RESOURCE || vars.DEPLOY_RESOURCE }}
          PREVIOUS: ${{ secrets.DEPLOY_PREVIOUS_IMAGE || vars.DEPLOY_PREVIOUS_IMAGE }}
          CANDIDATE: ${{ secrets.DEPLOY_CANDIDATE_IMAGE || vars.DEPLOY_CANDIDATE_IMAGE }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        shell: bash
        run: |
          python3 -u - <<'PY'
          import copy
          import json
          import os
          import re
          import subprocess
          import time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen


          def request(path, token, method="GET", body=None):
              headers = {"Authorization": "Bearer " + token, "Content-Type": "application/json"}
              data = None if body is None else json.dumps(body).encode()
              try:
                  with urlopen(Request(path, data, headers, method=method), timeout=30) as response:
                      return json.loads(response.read() or "{}")
              except HTTPError as error:
                  raise RuntimeError(f"{method} returned HTTP {error.code}") from None


          def wait_for(fetch, complete, seconds):
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  result = fetch()
                  if complete(result):
                      return result
                  time.sleep(3)
              raise TimeoutError("Update was not confirmed before timeout. Read the resource before retrying.")


          class AzureJob:
              readback_seconds = 285

              def __init__(self, resource):
                  pattern = r"/subscriptions/[0-9a-f-]{36}/resourceGroups/[\w.()-]+/providers/Microsoft\.App/jobs/[\w-]+"
                  if not re.fullmatch(pattern, resource, re.IGNORECASE):
                      raise ValueError("Expected an Azure Container Apps Job resource ID")
                  self.url = "https://management.azure.com" + resource + "?api-version=2025-01-01"
                  result = subprocess.run(
                      ["az", "account", "get-access-token", "--query", "accessToken", "-o", "tsv"],
                      capture_output=True, text=True, check=True,
                  )
                  self.token = result.stdout.strip()

              def read(self):
                  return request(self.url, self.token)

              @staticmethod
              def template(job):
                  return job["properties"]["template"]

              @staticmethod
              def other_config(job):
                  fields = ("configuration", "environmentId", "workloadProfileName")
                  return job.get("identity"), {name: job["properties"].get(name) for name in fields}

              @staticmethod
              def ready(job):
                  state = job["properties"]["provisioningState"]
                  if state in {"Failed", "Canceled"}:
                      raise RuntimeError(f"Azure job provisioning ended with {state}")
                  return state == "Succeeded"

              def update(self, before, template):
                  if self.read() != before:
                      raise RuntimeError("Azure job changed after preflight")
                  request(self.url, self.token, "PATCH", {"properties": {"template": template}})


          class CloudRunJob:
              readback_seconds = 140

              def __init__(self, resource):
                  if not re.fullmatch(r"projects/[\w-]+/locations/[\w-]+/jobs/[\w-]+", resource):
                      raise ValueError("Expected a Cloud Run Job resource name")
                  self.base = "https://run.googleapis.com/v2/"
                  self.url = self.base + resource
                  self.token = os.environ["GOOGLE_ACCESS_TOKEN"]

              def read(self):
                  return request(self.url, self.token)

              @staticmethod
              def template(job):
                  return job["template"]

              @staticmethod
              def other_config(job):
                  fields = ("labels", "annotations", "binaryAuthorization", "launchStage")
                  return {name: job.get(name) for name in fields}

              @staticmethod
              def ready(job):
                  state = job["terminalCondition"]["state"]
                  if state == "CONDITION_FAILED":
                      raise RuntimeError("Cloud Run job provisioning failed")
                  return state == "CONDITION_SUCCEEDED" and not job.get("reconciling")

              def update(self, before, template):
                  fields = ("name", "etag", "labels", "annotations", "binaryAuthorization",
                            "launchStage", "client", "clientVersion")
                  body = {name: before[name] for name in fields if name in before}
                  body["template"] = template
                  operation = request(self.url, self.token, "PATCH", body)
                  if "error" in operation:
                      raise RuntimeError("Cloud Run update operation failed")


          def job_containers(template):
              return template["containers"] if "containers" in template else template["template"]["containers"]


          def check_images(previous, candidate, operation):
              image_pattern = r"[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}"
              images = (previous,) if operation == "verify" else (previous, candidate)
              if not all(re.fullmatch(image_pattern, image) for image in images):
                  raise ValueError("Expected registry paths pinned by SHA-256")
              if operation == "verify":
                  return
              if previous == candidate or previous.split("@")[0] != candidate.split("@")[0]:
                  raise ValueError("Expected distinct digests from the same image repository")


          def release(job, previous, candidate, operation):
              if operation not in {"verify", "deploy", "rollback"}:
                  raise ValueError("Expected verify, deploy or rollback")
              expected, target = (candidate, previous) if operation == "rollback" else (previous, candidate)
              before = job.read()
              if not job.ready(before):
                  raise RuntimeError("Job is not ready for an update")
              template = copy.deepcopy(job.template(before))
              containers = job_containers(template)
              if len(containers) != 1 or containers[0]["image"] != expected:
                  raise RuntimeError("Job must have one container with the expected source image")
              if operation == "verify":
                  print("Verified: authorized read and expected fixed Job image")
                  return
              containers[0]["image"] = target
              job.update(before, template)
              def has_target_image(row):
                  return job.ready(row) and [c["image"] for c in job_containers(job.template(row))] == [target]

              after = wait_for(job.read, has_target_image, job.readback_seconds)
              if job.template(after) != template or job.other_config(after) != job.other_config(before):
                  raise RuntimeError("Job configuration changed during the image update")
              print(f"{operation} verified: fixed image and unchanged job configuration")


          def service_exposure(service):
              return (
                  service["ingress"],
                  service.get("invokerIamDisabled", False),
                  service.get("defaultUriDisabled", False),
              )


          def serving_revision(service):
              targets = service["trafficStatuses"]
              if len(targets) != 1 or targets[0].get("percent") != 100 or targets[0].get("tag"):
                  raise RuntimeError("Expected one untagged serving revision at 100%")
              return targets[0]["revision"].rsplit("/", 1)[-1]


          def service_template(service):
              template = copy.deepcopy(service["template"])
              template.pop("revision", None)
              return template


          def service_settled(service):
              if service.get("reconciling") or service.get("observedGeneration") != service["generation"]:
                  return False
              state = service["terminalCondition"]["state"]
              if state == "CONDITION_FAILED":
                  raise RuntimeError("Cloud Run service update failed")
              return state == "CONDITION_SUCCEEDED"


          def release_service(resource, previous, candidate, operation):
              if operation not in {"verify", "deploy"}:
                  raise ValueError("Cloud Run Service supports only verify or zero-traffic deploy")
              if not re.fullmatch(r"projects/[\w-]+/locations/[\w-]+/services/[\w-]+", resource):
                  raise ValueError("Expected a Cloud Run Service resource name")
              url = "https://run.googleapis.com/v2/" + resource
              token = os.environ["GOOGLE_ACCESS_TOKEN"]

              def read():
                  return request(url, token)

              before = read()
              if not service_settled(before):
                  raise RuntimeError("Cloud Run service is not ready for an update")
              exposure = service_exposure(before)
              if exposure[:2] != ("INGRESS_TRAFFIC_INTERNAL_ONLY", False):
                  raise RuntimeError("Expected internal ingress with invoker IAM enabled")
              baseline = serving_revision(before)
              if any(target.get("tag") for target in before.get("traffic", [])):
                  raise RuntimeError("Expected a service without traffic tags")
              serving = request(url + "/revisions/" + baseline, token)["containers"]
              if len(serving) != 1 or serving[0]["image"].rsplit("@", 1)[-1] != previous.rsplit("@", 1)[-1]:
                  raise RuntimeError("Serving revision does not have the expected image")
              if operation == "verify":
                  print("Verified: expected fixed image serves 100% of internal traffic")
                  return

              template = service_template(before)
              containers = template["containers"]
              if len(containers) != 1 or containers[0]["image"] != previous:
                  raise RuntimeError("Service must have one container with the expected source image")
              containers[0]["image"] = candidate
              pinned_traffic = [
                  {"type": "TRAFFIC_TARGET_ALLOCATION_TYPE_REVISION", "revision": baseline, "percent": 100}
              ]
              request(url + "?updateMask=template,traffic", token, "PATCH", {
                  "name": resource,
                  "etag": before["etag"],
                  "template": template,
                  "traffic": pinned_traffic,
              })
              after = wait_for(read, lambda service: service["generation"] != before["generation"]
                               and service_settled(service), 180)
              if service_template(after) != template or service_exposure(after) != exposure:
                  raise RuntimeError("Service template or exposure differs from the requested release")
              if serving_revision(after) != baseline or after["traffic"] != pinned_traffic:
                  raise RuntimeError("Serving revision changed or traffic was not pinned")

              revision = after["latestCreatedRevision"].rsplit("/", 1)[-1]
              if revision in {baseline, before["latestCreatedRevision"].rsplit("/", 1)[-1]}:
                  raise RuntimeError("No new zero-traffic revision was created")
              # Untagged zero-traffic revisions can be retired without becoming latestReadyRevision.
              deployed = request(url + "/revisions/" + revision, token)
              digest = candidate.rsplit("@", 1)[-1]
              conditions = {condition["type"]: condition["state"] for condition in deployed["conditions"]}
              if (deployed["containers"][0]["image"].rsplit("@", 1)[-1] != digest
                  or conditions.get("ContainerReady") != "CONDITION_SUCCEEDED"
                  or conditions.get("Ready") != "CONDITION_SUCCEEDED"):
                  raise RuntimeError("Candidate image or revision condition was not confirmed")
              print("Deploy verified: candidate at 0%, serving revision at 100%, exposure unchanged")


          def main():
              provider = os.environ["PROVIDER"]
              resource = os.environ["RESOURCE"]
              previous, candidate = os.environ["PREVIOUS"], os.environ["CANDIDATE"]
              operation = os.environ["OPERATION"]
              check_images(previous, candidate, operation)
              if provider == "gcp-service":
                  release_service(resource, previous, candidate, operation)
              else:
                  job = {"azure": AzureJob, "gcp": CloudRunJob}.get(provider)
                  if job is None:
                      raise ValueError("Expected azure, gcp, or gcp-service")
                  release(job(resource), previous, candidate, operation)


          if __name__ == "__main__":
              main()
          PY
