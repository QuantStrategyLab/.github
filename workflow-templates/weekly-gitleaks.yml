# Replace the shared ref with a reviewed full 40-character commit SHA before copying.
name: Weekly all-branch secret scan

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    uses: QuantStrategyLab/.github/.github/workflows/gitleaks.yml@REPLACE_WITH_REVIEWED_SHARED_COMMIT_SHA
    with:
      full-history: true
